        var carttotal = function(totalprice){
                
                var tax = (43/40);
                var shipcost = 15;
                sum = 0;
                for(i=0; i < totalprice.length; i++){
                    sum += totalprice[i];
                };
                sum *= tax
                if(sum > 0){

                }
                if(sum <= 0){
                   return(0) 
                }
                alert(sum)
                console.log(sum)
                
            //https://paypal.me/AuraAroundMeLLC?locale.x=en_US

        ///////////////////////////////////
        
        var addtocart = function(price, title, inventory, id){

            var qty = document.getElementById(id.toString()).value;
            
            console.log("qty", qty)
            
            var name = title;
            
            for(name in shoppingcart){
                inventory--;
            }
            
            if(inventory >= qty){
                for(var z = 1; z <= qty; z++){
                    shoppingcart.push(title)
                    totalprice.push(price)

                }
            }
            
            if(inventory < qty){
                console.log("not in stock")
            }
            console.log(totalprice, shoppingcart)
        };
        
        ///////////////////////////////////////////////////
        
        var viewcart = function(totalprice, shoppingcart){

            console.log(totalprice)
            console.log(shoppingcart)
        };
        
        //////////////improve clear cart/do not return value popped?//////////
        
        var clearcart = function(totalprice, shoppingcart){
            
            var i = totalprice.length;
            var j = shoppingcart.length;
            var x = 0;
            var y = 0;
            for(x; x < i; x++){
                totalprice.pop(x)
            }
            for(y; y < j; y++){
                shoppingcart.pop(j)
            }
        };
        
        /////////////////////////// IMPROVE REMOVE FROM CART FEATURE
  
        var removefromcart = function(totalprice, shoppingcart, price, title, id){
                
            var qty = document.getElementById(id.toString()).value;
            console.log("qty", qty)
            
            for(var x = 0; x < qty; x++){
                
                var i = totalprice.indexOf(price)
                var j = shoppingcart.indexOf(title)
                
                if (i > -1 && j > -1){
                    totalprice.splice(i, 1)
                    shoppingcart.splice(j, 1)
                }
                
                if (j > -1 && i <= -1){
                    return(totalprice, shoppingcart)
                }
                
                if(i > -1 && j <= -1){
                    return(totalprice, shoppingcart)
                    
                }
                
                if(i <= -1 && j <= -1 ){
                    return(totalprice, shoppingcart)
                }
            }
            return(totalprice, shoppingcart)
        }
            
//////////////functions///////////////////

    <head>
        <meta charset="UTF-8">

        <style>
            body{
                font-family: "Times New Roman", Times, serif;
                font-size: 16px;
                color: rgb(51, 51, 51);
                margin: 0; /* Remove default body margin */
                padding: 0; /* Remove default body padding */
            }
            .tab {
                overflow: hidden;
                border: 1px solid #ccc;
                background-color: #f1f1f1;
            }
            .tab button {
                background-color: inherit;
                float: left;
                border: none;
                outline: none;
                cursor: pointer;
                padding: 14px 16px;
                transition: 0.3s;
                font-size: 17px;
            }
            .tab button:hover {
                background-color: #ddd;
            }
            .tab button.active {
                background-color: #ccc;
            }
            .tabcontent {
                display: none;
                padding: 6px 12px;
                border: 1px solid #ccc;
                border-top: none;
            }
            /* Existing styles adjusted for tab content */
            #SFETBqty{
                position: relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                width: 40px;
                height: 30px;
                margin-right: 5px;
            }
            #SFETBqtybutton{
                position: relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                width: 65px;
                height: 36px;
                margin-right: 5px;
            }
            #SFETBremovefromcartbutton{
                position: relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
            }
            #SFETB{
                position: relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                margin-top: 10px;
                display: block; /* Make it a block element to take full width */
            }
            #checkoutbutton{
                position: relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                margin-top: 10px;
                margin-right: 5px;
            }
            #viewcartbutton{
                position:relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                margin-top: 10px;
                margin-right: 5px;
            }
            #clearcartbutton{
                position:relative; /* Changed to relative for flow within tabcontent */
                top: 0px;
                left: 0px;
                margin-top: 10px;
            }

        </style>
    </head>
    <body>
        <script>
        //this is a note
        /*
        this is a multi
        line note
        */
            var totalprice = [];
            var shoppingcart = [];
            var sum = 0;
            // var i = 0; // i is now used in for loops, no need for global var
    //////////////////objects///////////////////
            SFETB = {
                title: "Shining Fates Elite Trainer Box",
                price: 50,
                inventory: 10,};
    ///////////////objects///////////////////
    //////////////functions//////////////////
            var carttotal = function(totalprice_arr){ // Renamed parameter to avoid conflict with global totalprice
                var tax = (43/40);
                var shipcost = 15;
                sum = 0;
                for(let i=0; i < totalprice_arr.length; i++){
                    sum += totalprice_arr[i];
                }
                sum *= tax;
                if(sum > 0){
                    sum += shipcost;
                }
                if(sum <= 0){
                   return(0);
                }
                alert("Total: " + sum.toFixed(2)); // Display formatted total
                console.log(sum);};
            ///////////////////////////////////
            
            var addtocart = function(price, title, inventory_val, id){
                var qty_str = document.getElementById(id.toString()).value;
                var qty = parseInt(qty_str, 10); // Convert quantity to integer
                
                console.log("qty", qty);
                
                // Check if the requested quantity exceeds available inventory
                if(qty > 0 && SFETB.inventory >= qty){ // Use SFETB.inventory directly
                    for(var z = 1; z <= qty; z++){
                        shoppingcart.push(title);
                        totalprice.push(price);
                    }
                    SFETB.inventory -= qty; 
                } else if (qty <= 0) {
                    console.log("Please enter a quantity greater than zero.");
                } else {
                    console.log("Not enough items in stock. Available: " + SFETB.inventory + ", Requested: " + qty);
                }
                console.log("Current inventory for SFETB: " + SFETB.inventory); // Log updated inventory
                console.log(totalprice, shoppingcart);
            };
            
            ///////////////////////////////////////////////////
            
            var viewcart = function(totalprice_arr, shoppingcart_arr){ // Renamed parameters
                console.log("Items in cart:", shoppingcart_arr);
                console.log("Prices in cart:", totalprice_arr);
            };
            
            //////////////improve clear cart/do not return value popped?//////////
            
            var clearcart = function(){
                totalprice.length = 0;
                shoppingcart.length = 0;
                console.log("Cart cleared. Total price: ", totalprice, " Shopping cart: ", shoppingcart);
                SFETB.inventory = 10; // Reset inventory when cart is cleared
            };
            
            var removefromcart = function(price, title, id){
                    
                var qty_str = document.getElementById(id.toString()).value;
                var qty_to_remove = parseInt(qty_str, 10); // Convert quantity to integer
                
                console.log("qty to remove", qty_to_remove);
                
                if (qty_to_remove > 0) {
                    for(var x = 0; x < qty_to_remove; x++){
                        
                        var i = totalprice.indexOf(price);
                        var j = shoppingcart.indexOf(title);
                        
                        if (i > -1 && j > -1){
                            totalprice.splice(i, 1);
                            shoppingcart.splice(j, 1);
                            SFETB.inventory++; 
                        } else {
                            console.log("Item not found in cart: " + title);
                            break; // Stop trying to remove if item not found
                        }
                    }
                } else {
                    console.log("Please enter a quantity greater than zero to remove.");
                }
                console.log("Current inventory for SFETB: " + SFETB.inventory); // Log updated inventory
                console.log(totalprice, shoppingcart);
            }
    //////////////functions///////////////////

            function openTab(evt, tabName) {
                var i, tabcontent, tablinks;
                tabcontent = document.getElementsByClassName("tabcontent");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }
                tablinks = document.getElementsByClassName("tablinks");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].className = tablinks[i].className.replace(" active", "");
                }
                document.getElementById(tabName).style.display = "block";
                evt.currentTarget.className += " active";
            }

            // Set default tab to open on load
            document.addEventListener('DOMContentLoaded', (event) => {
                document.getElementById("defaultOpen").click();
            });

        </script>

        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'Home')" id="defaultOpen">Home</button>
            <button class="tablinks" onclick="openTab(event, 'ShoppingCart')">Shopping Cart</button>
            <button class="tablinks" onclick="openTab(event, 'About')">About</button>
        </div>

        <div id="Home" class="tabcontent">
            <h3>Home</h3>
            <p>Welcome to the store! Browse our products.</p>
            <!-- Product display could go here -->
        </div>

        <div id="ShoppingCart" class="tabcontent">
            <h3>Shopping Cart</h3>
            <p>Manage your items.</p>

            <input type="number" id="SFETBqty" min="0">
            <button type="button" id="SFETBqtybutton" onclick="addtocart(SFETB.price, SFETB.title, SFETB.inventory, 'SFETBqty')">Add SFETB</button>
            <button id="SFETBremovefromcartbutton" onclick="removefromcart(SFETB.price, SFETB.title, 'SFETBqty')"> Remove SFETB</button>

            <img src="https://www.kasandbox.org/programming-images/space/collisioncircle.png" id="SFETB" style="width:50px; Height:50px;">    
            
            <button id="checkoutbutton" onclick="carttotal(totalprice)">Check out Button</button>
            
            <button id="viewcartbutton" onclick="viewcart(totalprice, shoppingcart)">View Cart</button>
            
            <button id="clearcartbutton" onclick="clearcart()"> clear cart</button>
        </div>

        <div id="About" class="tabcontent">
            <h3>About</h3>
            <p>This is a simple e-commerce example.</p>
        </div>

    </body>
</html>
